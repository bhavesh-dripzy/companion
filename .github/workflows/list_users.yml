name: List Cognito Users
on: [workflow_dispatch]
permissions:
  id-token: write
  contents: read
jobs:
  list_users:
    runs-on: ubuntu-latest
    env:
      AWS_ACCOUNT_ID: "616551057455"
      AWS_REGION: ap-south-1
      AWS_DEPLOY_ROLE_ARN: "arn:aws:iam::616551057455:role/GitHubActionsDeployRole"
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Fetch SSM Logs
        run: |
          pip install boto3
          python3 -c '
          import boto3, time, os
          ssm = boto3.client("ssm", region_name=os.environ["AWS_REGION"])
          ec2 = boto3.client("ec2", region_name=os.environ["AWS_REGION"])
          
          instances = ec2.describe_instances(Filters=[{"Name": "instance-state-name", "Values": ["running"]}, {"Name": "tag:aws:cloudformation:stack-name", "Values": ["companion-graph"]}])
          instance_id = instances["Reservations"][0]["Instances"][0]["InstanceId"]
          print("Instance ID:", instance_id)
          
          cmd = ssm.send_command(
              InstanceIds=[instance_id],
              DocumentName="AWS-RunShellScript",
              Parameters={
                  "commands": [
                      "mkdir -p /etc/caddy",
                      "cat <<EOF > /etc/caddy/Caddyfile",
                      "graph.houzzat.in {",
                      "    reverse_proxy 127.0.0.1:8000",
                      "}",
                      "EOF",
                      "systemctl restart caddy",
                      "systemctl status caddy --no-pager"
                  ]
              }
          )
          command_id = cmd["Command"]["CommandId"]
          
          while True:
              res = ssm.get_command_invocation(CommandId=command_id, InstanceId=instance_id)
              if res.get("Status") not in ["Pending", "InProgress", "Delayed"]:
                  break
              time.sleep(2)
          print(res.get("StandardOutputContent", ""))
          print(res.get("StandardErrorContent", ""))
          '

<!DOCTYPE html><html lang="hi"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gemini Live Hindi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.mic{width:90px;height:90px;border-radius:50%;border:none;font-size:36px;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center}
.off{background:#334155;color:#94a3b8}.off:hover{background:#475569}
.connecting{background:#f59e0b;color:#fff}
.on{background:#ef4444;color:#fff;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 25px rgba(239,68,68,0)}}
.speaking{background:#22c55e;color:#fff}
.status{font-size:15px;color:#94a3b8;text-align:center;max-width:380px;line-height:1.5}
.transcript{font-size:14px;color:#cbd5e1;text-align:center;max-width:380px;min-height:36px}
.warn{font-size:11px;color:#f59e0b;text-align:center;max-width:380px}
</style></head><body>
<div class="warn">⚠️ Headphones recommended — prevents echo feedback</div>
<button id="mic" class="mic off" onclick="toggle()">🎤</button>
<div id="status" class="status">Click mic to start Hindi voice chat</div>
<div id="transcript" class="transcript"></div>
<script>
const K='AIzaSyDYWw-kEIlGW1b8xO3tEpkWyvDs9OEsd-E',M='models/gemini-2.5-flash-native-audio-latest';
const WS='wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key='+K;
let ws=null,ac=null,stream=null,active=!1,pc=null,np=0,speaking=!1;

function S(t){document.getElementById('status').textContent=t}
function C(c){document.getElementById('mic').className='mic '+c}
function T(t){document.getElementById('transcript').textContent=t}

async function toggle(){
 if(active){disconnect();return}
 C('connecting');S('Connecting to Gemini...');
 try{
  ws=new WebSocket(WS);ws.binaryType='arraybuffer';
  ws.onopen=()=>ws.send(JSON.stringify({setup:{model:M,generationConfig:{responseModalities:['AUDIO']},systemInstruction:{parts:[{text:'तुम एक मजेदार, friendly हिंदी voice assistant हो। हमेशा हिंदी में बोलो। थोड़ी Hinglish OK। छोटे और natural जवाब दो। दोस्त की तरह बात करो।'}]},inputAudioTranscription:{},outputAudioTranscription:{},realtimeInputConfig:{automaticActivityDetection:{disabled:!1,silenceDurationMs:600,prefixPaddingMs:50}}}}));
  ws.onmessage=async e=>{
   let t;if(typeof e.data==='string')t=e.data;else if(e.data instanceof Blob)t=await e.data.text();else{t=new TextDecoder().decode(e.data)}
   try{let m=JSON.parse(t);
    if(m.setupComplete!==undefined){C('on');S('सुन रहा हूं, बोलो! 🎤');active=!0;startMic();return}
    let sc=m.serverContent;if(!sc)return;
    if(sc.inputTranscription?.text){T('🗣️ '+sc.inputTranscription.text)}
    if(sc.outputTranscription?.text){T('🤖 '+sc.outputTranscription.text)}
    if(sc.modelTurn?.parts){for(let p of sc.modelTurn.parts){if(p.inlineData?.mimeType?.startsWith('audio/pcm')){
     if(!speaking){speaking=!0;C('speaking');S('बोल रहा हूं...')}
     playAudio(p.inlineData.data)
    }}}
    if(sc.turnComplete){speaking=!1;C('on');S('सुन रहा हूं...');T('')}
    if(sc.interrupted){speaking=!1;C('on')}
   }catch(err){console.debug('[gemini] non-JSON / parse skip:',err,(t||'').slice(0,80))}
  };
  // Surface the real reason. onerror fires BEFORE onclose and must NOT tear
  // down the session itself — otherwise the close code/reason is lost.
  ws.onclose=e=>{console.warn('[gemini] ws closed',e.code,e.reason,'wasClean=',e.wasClean);S('Socket closed ['+e.code+']'+(e.reason?': '+e.reason:' (no reason — likely network/proxy/extension)'));disconnect()}
  ws.onerror=ev=>{console.error('[gemini] ws error event',ev);S('Socket error — close code will follow…')}
 }catch(e){C('off');S('Error: '+e.message)}
}

async function startMic(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:{sampleRate:16000,channelCount:1,echoCancellation:!0,noiseSuppression:!0,autoGainControl:!0}});
  ac=new AudioContext({sampleRate:16000});if(ac.state==='suspended')await ac.resume();
  let src=ac.createMediaStreamSource(stream),proc=ac.createScriptProcessor(4096,1,1),buf=[],total=0;
  proc.onaudioprocess=e=>{
   if(!active||!ws||ws.readyState!==1||speaking)return;
   let f=e.inputBuffer.getChannelData(0),i16=new Int16Array(f.length);
   for(let i=0;i<f.length;i++)i16[i]=Math.max(-32768,Math.min(32767,f[i]*32767));
   let bytes=new Uint8Array(i16.buffer);buf.push(bytes);total+=bytes.length;
   if(total>=3200){let all=new Uint8Array(total),off=0;for(let b of buf){all.set(b,off);off+=b.length}buf=[];total=0;
    let b64='';for(let i=0;i<all.length;i++)b64+=String.fromCharCode(all[i]);
    b64=btoa(b64);ws.send(JSON.stringify({realtimeInput:{audio:{mimeType:'audio/pcm;rate=16000',data:b64}}}))}
  };
  src.connect(proc);let g=ac.createGain();g.gain.value=0;proc.connect(g);g.connect(ac.destination)
 }catch(e){S('Mic error: '+e.message)}
}

function playAudio(b64){
 if(!pc){pc=new AudioContext({sampleRate:24000});np=pc.currentTime}
 if(pc.state==='suspended')pc.resume();
 let raw=atob(b64),bytes=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
 let i16=new Int16Array(bytes.buffer),f32=new Float32Array(i16.length);
 for(let i=0;i<i16.length;i++)f32[i]=i16[i]/32768;
 let buf=pc.createBuffer(1,f32.length,24000);buf.getChannelData(0).set(f32);
 let src=pc.createBufferSource();src.buffer=buf;src.connect(pc.destination);
 let now=Math.max(pc.currentTime,np);src.start(now);np=now+f32.length/24000
}

function stopMic(){stream?.getTracks().forEach(t=>t.stop());ac?.close();stream=null;ac=null}
function disconnect(){stopMic();ws?.close();ws=null;active=!1;speaking=!1;pc?.close();pc=null;np=0;C('off');S('Disconnected')}
</script></body></html>

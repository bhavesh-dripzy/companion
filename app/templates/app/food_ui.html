<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Companion Food Agent</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f8fafc; color: #111827; }
    .card { max-width: 860px; margin: 0 auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 8px 28px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; font-size: 1.4rem; }
    .row { display: flex; gap: 10px; margin-bottom: 12px; }
    input, button { font-size: 14px; padding: 10px 12px; border-radius: 8px; border: 1px solid #d1d5db; }
    input { flex: 1; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    pre { background: #0b1020; color: #e5e7eb; padding: 12px; border-radius: 8px; overflow: auto; max-height: 520px; }
    .hint { color: #4b5563; font-size: 0.9rem; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Companion Food Agent</h1>
    <div class="hint">Type your food query, then call <code>/api/food/query/</code>.</div>
    <div class="row">
      <input id="message" placeholder="e.g. Find pizza near MG Road Bengaluru" />
      <button id="sendBtn">Search</button>
    </div>
    <pre id="output">Result will appear here...</pre>
  </div>

  <script>
    const sendBtn = document.getElementById("sendBtn");
    const messageInput = document.getElementById("message");
    const output = document.getElementById("output");

    async function runQuery() {
      const message = messageInput.value.trim();
      if (!message) {
        output.textContent = "Please enter a message.";
        return;
      }
      sendBtn.disabled = true;
      output.textContent = "Loading...";
      try {
        const resp = await fetch("/api/food/query/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const data = await resp.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = "Request failed: " + (err?.message || String(err));
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", runQuery);
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runQuery();
    });
  </script>
</body>
</html>

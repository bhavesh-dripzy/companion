name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: companion-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCOUNT_ID: "616551057455"
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS target account
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$ACCOUNT_ID" != "$AWS_ACCOUNT_ID" ]; then
            echo "Refusing to deploy to AWS account $ACCOUNT_ID; expected $AWS_ACCOUNT_ID."
            exit 1
          fi

      - name: Install CDK dependencies
        working-directory: infra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g aws-cdk

      - name: Clean stale CDK output
        run: rm -rf infra/cdk.out

      - name: CDK deploy
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: cdk deploy --require-approval never

      - name: Populate app secrets
        run: |
          python3 -c "
          import json, os
          # If APP_SECRETS_JSON override is set, use it directly.
          override = os.getenv('APP_SECRETS_JSON', '').strip()
          if override:
              json.loads(override)  # validate
              with open('/tmp/secrets.json', 'w') as f:
                  f.write(override)
              print('Using APP_SECRETS_JSON override.')
          else:
              secrets = {}
              for key in ('DEEPSEEK_API_KEY', 'GEMINI_API_KEY', 'GOOGLE_API_KEY',
                          'OPENAI_API_KEY', 'FOOD_ROUTER_PROVIDER',
                          'ADMIN_USERNAME', 'ADMIN_PASSWORD',
                          'GOOGLE_CALENDAR_CLIENT_ID', 'GOOGLE_CALENDAR_CLIENT_SECRET'):
                  val = os.getenv(key, '').strip()
                  if val:
                      secrets[key] = val
              if not secrets:
                  print('No secrets configured — skipping.')
                  exit(0)
              with open('/tmp/secrets.json', 'w') as f:
                  json.dump(secrets, f)
              print('Built secrets from individual keys.')
          "
          if [ -f /tmp/secrets.json ]; then
            aws secretsmanager put-secret-value \
              --secret-id companion/app \
              --secret-string "file:///tmp/secrets.json" \
              --region "$AWS_REGION"
            echo "Secret companion/app updated."
          fi
        env:
          APP_SECRETS_JSON: ${{ secrets.APP_SECRETS_JSON }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FOOD_ROUTER_PROVIDER: ${{ secrets.FOOD_ROUTER_PROVIDER }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Smoke test
        run: |
          API_URL="$(aws cloudformation describe-stacks \
            --stack-name companion-serverless \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiEndpoint'].OutputValue" \
            --output text)"
          curl -fsS "$API_URL/api/"

name: Deploy

on:
  # Deploy runs ONLY when triggered — never on an individual push to main. The
  # Promote workflow (scheduled ~every 3 days, or on demand) fast-forwards main and
  # then calls this; a human can also run it manually for a hotfix. So production
  # ships only when triggered or every 3 days, never on each merge.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: companion-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCOUNT_ID: "616551057455"
      AWS_REGION: ap-south-1
      AWS_DEPLOY_ROLE_ARN: "arn:aws:iam::616551057455:role/GitHubActionsDeployRole"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS target account
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$ACCOUNT_ID" != "$AWS_ACCOUNT_ID" ]; then
            echo "Refusing to deploy to AWS account $ACCOUNT_ID; expected $AWS_ACCOUNT_ID."
            exit 1
          fi

      - name: Install CDK dependencies
        working-directory: infra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g aws-cdk

      - name: Clean stale CDK output
        run: rm -rf infra/cdk.out

      - name: CDK deploy
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEPLOY_EC2: "true"
        run: cdk deploy --all --require-approval never

      - name: Populate app secrets
        run: |
          # OAuth callbacks and the post-login bounce must use the stable public
          # domain where users are actually logged in — not the raw execute-api
          # endpoint (which is a different origin and would drop the session).
          export PUBLIC_BASE_URL="https://app.jatayulabs.com"
          python3 <<'PY'
          import json
          import os

          override = os.getenv("APP_SECRETS_JSON", "").strip()
          if override:
              secrets = json.loads(override)
              public_base_url = os.getenv("PUBLIC_BASE_URL", "").strip()
              if public_base_url:
                  secrets["PUBLIC_BASE_URL"] = public_base_url.rstrip("/")
              with open("/tmp/secrets.json", "w") as f:
                  json.dump(secrets, f)
              print("Using APP_SECRETS_JSON override.")
          else:
              secrets = {}
              for key in (
                  "SARVAM_API_KEY",
                  "GEMINI_API_KEY",
                  "GOOGLE_API_KEY",
                  "OPENAI_API_KEY",
                  "FOOD_ROUTER_PROVIDER",
                  "ADMIN_USERNAME",
                  "ADMIN_PASSWORD",
                  "GOOGLE_CALENDAR_CLIENT_ID",
                  "GOOGLE_CALENDAR_CLIENT_SECRET",
                  "TWILIO_ACCOUNT_SID",
                  "TWILIO_AUTH_TOKEN",
                  "TWILIO_FROM_NUMBER",
                  "PUBLIC_BASE_URL",
              ):
                  val = os.getenv(key, "").strip()
                  if val:
                      secrets[key] = val.rstrip("/") if key == "PUBLIC_BASE_URL" else val
              if not secrets:
                  print("No secrets configured — skipping.")
                  raise SystemExit(0)
              with open("/tmp/secrets.json", "w") as f:
                  json.dump(secrets, f)
              print("Built secrets from individual keys.")
          PY
          if [ -f /tmp/secrets.json ]; then
            aws secretsmanager get-secret-value \
              --secret-id companion/app \
              --query SecretString \
              --output text \
              --region "$AWS_REGION" > /tmp/existing-secrets.json 2>/dev/null || echo '{}' > /tmp/existing-secrets.json
          python3 <<'PY'
          import json

          with open("/tmp/existing-secrets.json") as f:
              existing = json.load(f)
          with open("/tmp/secrets.json") as f:
              updates = json.load(f)
          for k, v in updates.items():
              if v:
                  existing[k] = v
          with open("/tmp/secrets.json", "w") as f:
              json.dump(existing, f)
          PY
            aws secretsmanager put-secret-value \
              --secret-id companion/app \
              --secret-string "file:///tmp/secrets.json" \
              --region "$AWS_REGION"
            echo "Secret companion/app updated."
          fi
        env:
          APP_SECRETS_JSON: ${{ secrets.APP_SECRETS_JSON }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FOOD_ROUTER_PROVIDER: ${{ secrets.FOOD_ROUTER_PROVIDER }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}

      - name: Ensure Cognito admin user
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import sys

          raw_secret = subprocess.check_output(
              [
                  "aws",
                  "secretsmanager",
                  "get-secret-value",
                  "--secret-id",
                  "companion/app",
                  "--query",
                  "SecretString",
                  "--output",
                  "text",
                  "--region",
                  os.environ["AWS_REGION"],
              ],
              text=True,
          )
          secret = json.loads(raw_secret)
          username = str(secret.get("ADMIN_USERNAME") or "").strip()
          password = str(secret.get("ADMIN_PASSWORD") or "").strip()
          if not username or not password:
              print("No ADMIN_USERNAME/ADMIN_PASSWORD configured; skipping Cognito admin user.")
              sys.exit(0)

          user_pool_id = subprocess.check_output(
              [
                  "aws",
                  "cloudformation",
                  "describe-stacks",
                  "--stack-name",
                  "companion-serverless",
                  "--query",
                  "Stacks[0].Outputs[?OutputKey=='CognitoUserPoolId'].OutputValue",
                  "--output",
                  "text",
                  "--region",
                  os.environ["AWS_REGION"],
              ],
              text=True,
          ).strip()

          exists = subprocess.call(
              [
                  "aws",
                  "cognito-idp",
                  "admin-get-user",
                  "--user-pool-id",
                  user_pool_id,
                  "--username",
                  username,
                  "--region",
                  os.environ["AWS_REGION"],
              ],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ) == 0
          if not exists:
              subprocess.check_call(
                  [
                      "aws",
                      "cognito-idp",
                      "admin-create-user",
                      "--user-pool-id",
                      user_pool_id,
                      "--username",
                      username,
                      "--message-action",
                      "SUPPRESS",
                      "--region",
                      os.environ["AWS_REGION"],
                  ],
                  stdout=subprocess.DEVNULL,
              )
          subprocess.check_call(
              [
                  "aws",
                  "cognito-idp",
                  "admin-set-user-password",
                  "--user-pool-id",
                  user_pool_id,
                  "--username",
                  username,
                  "--password",
                  password,
                  "--permanent",
                  "--region",
                  os.environ["AWS_REGION"],
              ],
              stdout=subprocess.DEVNULL,
          )
          print(f"Cognito admin user '{username}' is ready.")
          PY

      - name: Smoke test
        run: |
          # Hit the Lambda Function URL directly (the live API entry; CloudFront +
          # custom domain DNS may still be propagating right after deploy).
          API_URL="$(aws cloudformation describe-stacks \
            --stack-name companion-serverless \
            --query "Stacks[0].Outputs[?OutputKey=='ApiFunctionUrl'].OutputValue" \
            --output text)"
          curl -fsS "${API_URL%/}/api/"

  # Detect whether this push touched anything the APK is built from, so the
  # (slow) Android build only runs when it would actually change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.filter.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            apk:
              - 'frontend/**'
              - 'ci/**'
              - '.github/workflows/deploy.yml'

  # Rebuild the Android APK from the just-deployed code and publish it to the
  # app-downloads bucket, which /companion.apk redirects to. Runs after deploy
  # so the bucket exists, and only when APK-relevant files changed. Signs with
  # the committed fixed debug keystore so every build has the same signature
  # and installs update in place.
  build-apk:
    needs: [deploy, changes]
    if: needs.changes.outputs.apk == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCOUNT_ID: "616551057455"
      AWS_REGION: ap-south-1
      AWS_DEPLOY_ROLE_ARN: "arn:aws:iam::616551057455:role/GitHubActionsDeployRole"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — versionCode is derived from commit count

      - uses: actions/setup-node@v4
        with:
          node-version: "22"  # Capacitor 8 CLI requires Node >=22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build web and add Android platform
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap add android 2>/dev/null || npx cap sync android

      - name: Set Android version from git history
        # `frontend/android` is gitignored and regenerated by `cap add` with
        # Capacitor's default versionCode 1, so each build would otherwise NOT be
        # seen as an upgrade. Derive a monotonic versionCode from the commit count.
        run: |
          VC=$(git rev-list --count HEAD)
          sed -i -E "s/versionCode [0-9]+/versionCode ${VC}/; s/versionName \"[^\"]*\"/versionName \"1.0.${VC}\"/" \
            frontend/android/app/build.gradle
          grep -E "versionCode|versionName" frontend/android/app/build.gradle

      - name: Sign with the fixed debug keystore
        run: |
          mkdir -p ~/.android
          cp ci/companion-debug.keystore ~/.android/debug.keystore

      - name: Assemble debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Publish APK to S3
        run: |
          BUCKET="$(aws cloudformation describe-stacks \
            --stack-name companion-serverless \
            --query "Stacks[0].Outputs[?OutputKey=='AppDownloadsBucket'].OutputValue" \
            --output text)"
          aws s3 cp \
            frontend/android/app/build/outputs/apk/debug/app-debug.apk \
            "s3://${BUCKET}/companion.apk" \
            --content-type application/vnd.android.package-archive
          echo "Published companion.apk to ${BUCKET}"

name: Deploy landing (fast)

# Company website only. Never invoke infra/app.py or cdk deploy --all here.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: companion-deploy-landing
  cancel-in-progress: false

jobs:
  deploy-landing:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCOUNT_ID: "616551057455"
      AWS_REGION: ap-south-1
      LANDING_STACK: companion-landing
    steps:
      - uses: actions/checkout@v4
      - name: Require promoted main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate static release
        run: |
          python site/prepare_static.py
          python site/check_static.py
          node site/test-edge-routes.cjs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::616551057455:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify target account
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
      - name: Install website infrastructure tools
        run: |
          pip install aws-cdk-lib==2.253.1 constructs==10.6.0 boto3==1.43.6
          npm install --global aws-cdk@2.1127.0
      - name: Synthesize isolated website stack
        working-directory: infra
        run: cdk --app "python landing_app.py" synth companion-landing --quiet
      - name: Reject non-website resources
        run: python site/check_infrastructure.py infra/cdk.out/companion-landing.template.json
      - name: Deploy company website only
        working-directory: infra
        run: |
          cdk --app "python landing_app.py" deploy companion-landing \
            --exclusively --require-approval never \
            --outputs-file /tmp/landing-outputs.json
      - name: Resolve distribution
        id: cfn
        run: |
          DIST="$(aws cloudformation describe-stacks --stack-name "$LANDING_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)"
          test -n "$DIST" && test "$DIST" != None
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"
      - name: Invalidate changed site content
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cfn.outputs.dist }}" --paths '/*'
      - name: Review and repair company-site DNS aliases
        run: |
          python site/cutover_dns.py
          python site/cutover_dns.py --apply
      - name: Verify live release
        run: python site/verify_live.py https://jatayulabs.com

# Tooling config for the Companion backend.
# The rewrite lives under `core/`; lint + the file-size gate are enforced there
# first and expanded outward as legacy modules are ported (see CONTRIBUTING.md).

[tool.ruff]
target-version = "py312"
line-length = 100
# Legacy + generated trees are excluded while the strangler rewrite is in flight.
# Each is removed from this list as it is ported into `core/`.
extend-exclude = [
    "app",
    "POC",
    "src",
    "config",
    "infra/cdk.out",
    "cdk.out",
    "node_modules",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter, not the linter
    "B008",   # FastAPI uses function calls in argument defaults (Depends/Query)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM", "E402"]
"**/__init__.py" = ["F401"]  # re-export modules

[tool.ruff.lint.isort]
known-first-party = ["core", "companion_api", "app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: fast, no network or AWS (always run in CI)",
    "integration: mocked external services (LLM/MCP/AWS)",
    "component: per-provider end-to-end against recorded fixtures",
    "live: hits real external services; skipped in CI",
]

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: companion-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK dependencies
        working-directory: infra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g aws-cdk

      - name: CDK deploy
        working-directory: infra
        run: cdk deploy --require-approval never

      - name: Populate app secrets
        run: |
          if [ -n "$APP_SECRETS_JSON" ]; then
            aws secretsmanager put-secret-value \
              --secret-id companion/app \
              --secret-string "$APP_SECRETS_JSON" \
              --region "$AWS_REGION"
            echo "Secret companion/app updated."
          else
            echo "APP_SECRETS_JSON not set — skipping."
          fi
        env:
          APP_SECRETS_JSON: ${{ secrets.APP_SECRETS_JSON }}

      - name: Smoke test
        run: |
          API_URL="$(aws cloudformation describe-stacks \
            --stack-name companion-serverless \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiEndpoint'].OutputValue" \
            --output text)"
          curl -fsS "$API_URL/api/"

name: List Cognito Users
on: [workflow_dispatch]
permissions:
  id-token: write
  contents: read
jobs:
  list_users:
    runs-on: ubuntu-latest
    env:
      AWS_ACCOUNT_ID: "616551057455"
      AWS_REGION: ap-south-1
      AWS_DEPLOY_ROLE_ARN: "arn:aws:iam::616551057455:role/GitHubActionsDeployRole"
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Fetch SSM Logs
        run: |
          pip install boto3
          python3 -c '
          import boto3, time, os
          ssm = boto3.client("ssm", region_name=os.environ["AWS_REGION"])
          ec2 = boto3.client("ec2", region_name=os.environ["AWS_REGION"])
          
          instances = ec2.describe_instances(Filters=[{"Name": "instance-state-name", "Values": ["running"]}, {"Name": "tag:aws:cloudformation:stack-name", "Values": ["companion-graph"]}])
          instance_id = instances["Reservations"][0]["Instances"][0]["InstanceId"]
          print("Instance ID:", instance_id)
          
          cmd = ssm.send_command(
              InstanceIds=[instance_id],
              DocumentName="AWS-RunShellScript",
              Parameters={
                  "commands": [
                      "curl -L -o /usr/bin/caddy \"https://caddyserver.com/api/download?os=linux&arch=arm64\"",
                      "chmod +x /usr/bin/caddy",
                      "groupadd --system caddy || true",
                      "useradd --system --gid caddy --create-home --home-dir /var/lib/caddy --shell /usr/sbin/nologin --comment \"Caddy web server\" caddy || true",
                      "cat <<EOF > /etc/systemd/system/caddy.service",
                      "[Unit]",
                      "Description=Caddy",
                      "Documentation=https://caddyserver.com/docs/",
                      "After=network.target network-online.target",
                      "Requires=network-online.target",
                      "",
                      "[Service]",
                      "Type=notify",
                      "User=root",
                      "Group=root",
                      "ExecStart=/usr/bin/caddy run --environ --config /etc/caddy/Caddyfile",
                      "ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --force",
                      "TimeoutStopSec=5s",
                      "LimitNOFILE=1048576",
                      "LimitNPROC=512",
                      "PrivateTmp=true",
                      "ProtectSystem=full",
                      "AmbientCapabilities=CAP_NET_ADMIN CAP_NET_BIND_SERVICE",
                      "",
                      "[Install]",
                      "WantedBy=multi-user.target",
                      "EOF",
                      "systemctl daemon-reload",
                      "systemctl enable --now caddy",
                      "systemctl status caddy --no-pager"
                  ]
              }
          )
          command_id = cmd["Command"]["CommandId"]
          
          time.sleep(5)
          res = ssm.get_command_invocation(CommandId=command_id, InstanceId=instance_id)
          print(res.get("StandardOutputContent", res.get("StandardErrorContent", "No output")))
          '

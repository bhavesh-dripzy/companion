name: List Cognito Users
on: [workflow_dispatch]
permissions:
  id-token: write
  contents: read
jobs:
  list_users:
    runs-on: ubuntu-latest
    env:
      AWS_ACCOUNT_ID: "616551057455"
      AWS_REGION: ap-south-1
      AWS_DEPLOY_ROLE_ARN: "arn:aws:iam::616551057455:role/GitHubActionsDeployRole"
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Check Graph Data
        run: |
          pip install boto3 requests
          python3 -c '
          import boto3, json, os, requests
          sm = boto3.client("secretsmanager", region_name=os.environ["AWS_REGION"])
          res = sm.get_secret_value(SecretId="companion/graph-service-token")
          token = json.loads(res["SecretString"]).get("token")
          headers = {"Authorization": f"Bearer {token}"}
          resp = requests.post("https://graph.houzzat.in/query", headers=headers, json={"cypher": "MATCH (n) RETURN labels(n), count(n)"})
          print("Graph Node Counts:", resp.json())
          
          resp2 = requests.post("https://graph.houzzat.in/query", headers=headers, json={"cypher": "MATCH (u:User)-[r]->(x) RETURN u.id, type(r), labels(x), x LIMIT 10"})
          print("Graph Relationships:", resp.json())
          '

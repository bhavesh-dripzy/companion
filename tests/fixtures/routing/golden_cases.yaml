# Golden routing cases — used by test_routing_regression.py (L2 live tests)
# and by scripts/diff_routing.py for human-readable diffs.
#
# Format per entry:
#   - message: <string>
#     previous: <provider_id | null>
#     expected_task_type: <task_type>
#     expected_providers: [<provider>, ...]  # null means any/order-insensitive
#     notes: <optional explanation>
#
# When a routing decision intentionally changes, update this file and the
# corresponding test case. A PR that breaks a golden case without updating
# this file MUST NOT be merged.


name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  # Not `main`: main only receives already-tested commits via the promote
  # workflow, and Deploy runs its own smoke test. Skipping it here drops 3
  # redundant CI runs/day.
  push:
    branches: [dev, staging]

# Least-privilege token. `pull-requests: read` is required by dorny/paths-filter
# on pull_request events (it lists changed files via the API); without it the
# `changes` job fails with "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs on the same ref. Rapid successive pushes (a busy dev
# day) shouldn't each run CI to completion — that's the biggest Actions-minutes
# drain. Deploy workflows keep cancel-in-progress:false; only CI cancels.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scope the expensive jobs to what actually changed: a backend-only commit
  # skips the frontend build, a frontend-only commit skips the backend tests.
  # Gating is via job-level `if` (not workflow-level `paths`) so branch-protection
  # required checks resolve a skipped job as neutral, never "stuck waiting".
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'core/**'
              - 'companion_api/**'
              - 'leadgen/**'
              - 'deploy/**'
              - 'tests/**'
              - 'scripts/**'
              - 'requirements.txt'
              - 'pyproject.toml'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.6.9
      # Lint + format are enforced on the rewrite (`core/`) and tooling first,
      # then widened as legacy modules are ported (see CONTRIBUTING.md).
      - name: Ruff lint
        run: ruff check core scripts/check_file_size.py
      - name: Ruff format check
        run: ruff format --check core scripts/check_file_size.py
      - name: File-size gate (<=250 lines)
        run: python scripts/check_file_size.py core

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      FOOD_ROUTER_PROVIDER: sarvam
      SARVAM_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node deps (needed for mcp-remote)
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python tests
        run: pytest -m "not live" --ignore=tests/test_district_mcp_executor.py

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vite build
        working-directory: frontend
        run: npm run build

  # Single always-run gate used as the one required status check in branch
  # protection. Green when no upstream job failed/was cancelled — a skipped job
  # (e.g. backend-tests on a frontend-only change) counts as OK, so required
  # checks never get "stuck waiting" on a job that correctly didn't run.
  ci-gate:
    needs: [lint, backend-tests, frontend-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require no failed CI jobs
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "upstream results: $results"
          case ",$results," in
            *,failure,*|*,cancelled,*)
              echo "::error::A required CI job failed or was cancelled."; exit 1 ;;
            *)
              echo "CI gate passed." ;;
          esac
